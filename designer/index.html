<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WCL Designer</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">W</span>
      <div>
        <h1>WCL Designer</h1>
        <p>LFM form designer</p>
      </div>
    </div>
    <div class="toolbar">
      <label for="projectSelect" class="sr-only">Project</label>
      <select id="projectSelect"></select>
      <button id="newProjectBtn" type="button" title="Create an application, host or module project">New project…</button>
      <label for="formSelect" class="sr-only">Form</label>
      <select id="formSelect"></select>
      <button id="reloadBtn" type="button">Reload</button>
      <button id="saveBtn" type="button">Save</button>
      <label for="previewMode" class="sr-only">Preview target</label>
      <select id="previewMode" title="What Preview builds">
        <option value="project">Project</option>
        <option value="form">Current form</option>
      </select>
      <button id="previewBtn" type="button" title="Build and run the project or the selected form">Preview</button>
      <button id="projectBtn" type="button">Project…</button>
      <button id="importBtn" type="button">Import .lfm</button>
      <input id="importFile" type="file" accept=".lfm" hidden>
    </div>
    <div id="status" class="status">Starting...</div>
  </header>

  <main class="workspace">
    <aside class="panel tree-panel">
      <div class="panel-title">Palette</div>
      <div id="palette" class="palette"></div>
      <div class="panel-title components-title">Components</div>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="panel canvas-panel">
      <div class="canvas-head">
        <div class="view-switch">
          <button id="designTab" type="button" class="view-tab active" title="Design (F12 or Ctrl+`)">Design</button>
          <button id="sourceTab" type="button" class="view-tab" title="Source (F12 or Ctrl+`)">Source</button>
        </div>
        <span id="formTitle">No form</span>
        <span class="hint">Drag to move · handles to resize · Alt disables the grid</span>
      </div>
      <div class="canvas-scroll">
        <div id="canvas" class="canvas"></div>
        <div id="sourceView" class="source-view hidden-view">
          <div class="source-head">
            <span id="sourceName">unit1.pas</span>
            <span id="sourceStatus" class="source-status"></span>
            <button id="sourceSaveBtn" type="button" title="Save the unit; also saves the form when it has changes">Save</button>
            <button id="sourceReloadBtn" type="button">Reload</button>
          </div>
          <div class="source-editor-wrap">
            <div id="sourceGutter" class="source-gutter" aria-hidden="true"></div>
            <textarea id="sourceEditor" class="source-editor" spellcheck="false" wrap="off"></textarea>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel inspector-panel">
      <div class="panel-title">Properties</div>
      <div id="inspector" class="inspector"></div>
    </aside>
  </main>

  <dialog id="projectDialog" class="project-dialog">
    <div class="dialog-head">
      <h2>Project</h2>
      <button id="projectCloseBtn" type="button">Close</button>
    </div>
    <div class="dialog-section">
      <div class="dialog-title">
        <span>Settings</span>
        <button id="saveSettingsBtn" type="button">Save</button>
      </div>
      <div class="dialog-form settings-form">
        <label class="dialog-field">
          <span>Name</span>
          <input id="settingName" type="text">
        </label>
        <label class="dialog-field">
          <span>Type</span>
          <select id="settingKind">
            <option value="application">Application</option>
            <option value="host">Host application</option>
            <option value="module">Module</option>
          </select>
        </label>
        <label class="dialog-field">
          <span>Program</span>
          <input id="settingProgram" type="text" placeholder="project1.lpr">
        </label>
        <label class="dialog-field">
          <span>HTML</span>
          <input id="settingHtml" type="text" placeholder="project1.html">
        </label>
        <label class="dialog-field">
          <span>Output</span>
          <input id="settingOutput" type="text" placeholder="program name + .js">
        </label>
        <label class="dialog-field module-only">
          <span>Entry unit</span>
          <input id="settingEntry" type="text" placeholder="Module1">
        </label>
        <label class="dialog-field module-only">
          <span>Manifest</span>
          <input id="settingManifest" type="text" placeholder="modules.json">
        </label>
        <label class="dialog-field host-only">
          <span>Modules</span>
          <textarea id="settingModules" rows="3" placeholder="../module/preview/lib/modules.json"></textarea>
        </label>
        <p class="dialog-hint host-only">One module manifest per line.</p>
      </div>
    </div>
    <div class="dialog-section">
      <div class="dialog-title">
        <span>Forms</span>
        <button id="newFormBtn" type="button">New form</button>
      </div>
      <ul id="dialogForms" class="dialog-list"></ul>
    </div>
    <div class="dialog-section">
      <div class="dialog-title">
        <span>Units</span>
        <button id="newUnitBtn" type="button">New unit</button>
      </div>
      <ul id="dialogUnits" class="dialog-list"></ul>
    </div>
    <label class="dialog-check">
      <input id="deleteFilesCheck" type="checkbox">
      Also delete files when removing
    </label>
  </dialog>

  <dialog id="newProjectDialog" class="project-dialog new-project-dialog">
    <div class="dialog-head">
      <h2>New project</h2>
      <button id="newProjectCloseBtn" type="button">Close</button>
    </div>
    <div class="dialog-section">
      <div class="dialog-form">
        <label class="dialog-field">
          <span>Name</span>
          <input id="newProjectName" type="text" value="New project">
        </label>
        <label class="dialog-field">
          <span>Folder id</span>
          <input id="newProjectId" type="text" value="new-project">
        </label>
        <label class="dialog-field">
          <span>Type</span>
          <select id="newProjectKind">
            <option value="application">Application</option>
            <option value="host">Host application</option>
            <option value="module">Module</option>
          </select>
        </label>
        <p id="newProjectHint" class="dialog-hint"></p>
      </div>
    </div>
    <div class="dialog-foot">
      <button id="newProjectCreateBtn" type="button" class="dialog-primary">Create</button>
    </div>
  </dialog>

  <dialog id="previewDialog" class="preview-dialog">
    <div class="dialog-head">
      <h2 id="previewTitle">Preview</h2>
      <div class="dialog-actions">
        <a id="previewOpenLink" class="dialog-link" href="#" target="_blank" rel="noopener">Open in tab</a>
        <button id="previewCloseBtn" type="button">Close</button>
      </div>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="previewFrame" title="Form preview"></iframe>
    </div>
  </dialog>

  <dialog id="buildDialog" class="build-dialog">
    <div class="dialog-head">
      <h2>Build log</h2>
      <button id="buildCloseBtn" type="button">Close</button>
    </div>
    <pre id="buildOutput" class="build-output"></pre>
  </dialog>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
