name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'examples/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The demos are published as-is: project1.js and mobile.js are committed,
      # so no pas2js toolchain is needed here. api.php is shipped too but
      # GitHub Pages does not execute PHP; host it elsewhere and point
      # "Load from URL" at that server.
      - name: Prepare site
        run: |
          mkdir -p site
          cp -R examples/demo/. site/
          cp -R examples/mobile site/MobileDemo
          mkdir -p site/examples
          cp -R examples/host site/examples/host
          cp -R examples/module site/examples/module

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
