name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'Example/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The demo is published as-is: project1.js is committed, so no pas2js
      # toolchain is needed here. api.php is shipped too but GitHub Pages
      # does not execute PHP; host it elsewhere and point "Load from URL"
      # at that server.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: Example

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
